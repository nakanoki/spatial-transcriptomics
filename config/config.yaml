project:
  name: spatial-transcriptomics
  description: ""
  random_seed: 0

# 入力データ（例: 10x Genomics Visium）
inputs:
  # 例: Space Ranger の出力ディレクトリ（filtered_feature_bc_matrix.h5 等を含む）
  spaceranger_out_dir: ""
  # 例: H&E 画像
  tissue_image_path: ""
  # 例: サンプルID/ライブラリID
  sample_id: "breast_cancer"


# QC 設定
qc:
  # フィルタ候補（必要なものだけ使う）
  min_counts_per_spot: 3000
  min_genes_per_spot: 500
  max_mito_percent: null
  max_ribo_percent: null
  max_hb_percent: null
  min_genes: 0
  min_cells: 5
  pct_counts_mt_max: 12
  n_top_genes: 2000
  target_sum: 1e4

# 正規化設定
normalization:
  method: "log1p"          # log1p / sctransform / none
  target_sum: 10000

# 特徴量選択設定
feature_selection:
  method: "hvg"            # hvg / none
  n_top_genes: 2000

# 次元削減設定
dimension_reduction:
  pca_n_components: 50
  neighbors_k: 15
  umap_min_dist: 0.5

# クラスタリング設定
clustering:
  method: "leiden"         # leiden / louvain
  resolution: 1.0

# 空間解析設定
spatial:
  # 空間座標のスケールや単位（ライブラリ由来なら自動のことが多い）
  coordinate_unit: "pixel"
  spot_diameter_fullres: null
  # 画像との重ね合わせ表示
  image_alpha: 0.8

markers:
  method: "wilcoxon"       # wilcoxon / ttest / logistic_regression 等
  n_genes: 50

export:
  # 出力ファイル名の接頭辞など
  run_name: "run"
  save_anndata: true
  save_plots: true
  plot_format: "png"       # png / pdf / svg
  dpi: 150
