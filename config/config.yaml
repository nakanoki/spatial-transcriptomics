project:
  name: spatial-transcriptomics
  description: ""
  random_seed: 0

# 入力データ（例: 10x Genomics Visium）
inputs:
  # 例: Space Ranger の出力ディレクトリ（filtered_feature_bc_matrix.h5 等を含む）
  spaceranger_out_dir: ""
  # 例: H&E 画像。現状は spatial/ 配下の画像を自動で使うため未参照
  tissue_image_path: ""
  # 例: サンプルID/ライブラリID
  sample_id: "breast_cancer"


# QC 設定
qc:
  min_genes_per_spot: 500   # スポットあたりの検出遺伝子数の下限
  min_cells: 5              # その遺伝子が検出されるスポット数の下限
  pct_counts_mt_max: 12     # ミトコンドリア遺伝子由来 UMI の割合の上限（%）

# 正規化設定
normalization:
  method: "log1p"          # log1p / none
  target_sum: 10000

# 特徴量選択設定
feature_selection:
  method: "hvg"            # hvg / none
  n_top_genes: 2000

# 次元削減設定
dimension_reduction:
  pca_n_components: 50
  neighbors_k: 15
  umap_min_dist: 0.5

# クラスタリング設定
clustering:
  method: "leiden"         # leiden / louvain
  resolution: 1.0

markers:
  method: "wilcoxon"       # wilcoxon / ttest / logistic_regression 等
  n_genes: 50

export:
  # 出力ファイル名の接頭辞など
  run_name: "run"
  save_anndata: true
  save_plots: true
  dpi: 150
