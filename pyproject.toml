    "h5py>=3.15.1",
    "ipykernel>=7.2.0",
    "leidenalg>=0.10.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scanpy>=1.11.5",
    "seaborn>=0.13.2",
    "squidpy>=1.8.2",
    "umap-learn>=0.5.11",
]

[project.optional-dependencies]
# 解析本体には不要。Docker イメージの Jupyter 環境でのみ使う（Dockerfile 参照）。
notebook = [
    "jupyterlab>=4.0",
]
