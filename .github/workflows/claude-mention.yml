# Issue や PR のコメントで @claude と書いたときに応答する。
# レビュー中の追加指示や、その場の質問用。
name: Claude (Mention)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  respond:
    # 公開リポジトリでは誰でもコメントできるため、コメント主が所有者のときだけ動く
    if: contains(github.event.comment.body, '@claude') && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write        # claude-code-action が OIDC トークンを取得するのに必要
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
